name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# CPU build and tests. The CUDA path is tested by hand on a GPU host, see the README.
jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install --no-build-isolation . pytest numpy
      - run: pytest
  pins:
    name: submodule pins are on upstream main, vectors are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          # A shallow submodule has no history between the pin and main.
          fetch-depth: 0
      - run: |
          for m in external/tandem-c external/tandem-cuda; do
            git -C $m fetch origin main && git -C $m merge-base --is-ancestor HEAD FETCH_HEAD
          done
      - run: git clone --depth 1 https://github.com/tandem-rng/spec ../spec
      - run: diff ../spec/vectors.json tests/vectors.json
